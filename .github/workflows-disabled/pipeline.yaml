name: pipeline

on:
  push:
    branches:
      - main
      - 'feature/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GAR_LOCATION: us-central1
  PROJECT_ID: porfolio-480111
  BACKEND_REPO: workout-backend
  BACKEND_IMAGE_NAME: backend
  FRONTEND_REPO: workout-frontend
  FRONTEND_IMAGE_NAME: frontend

jobs:
  unit:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend test image
        run: docker build -f Dockerfile.test -t backend-test:ci .
      - name: Run unit tests
        run: |
          set -euxo pipefail
          mkdir -p reports
          docker run --rm -v "$PWD/reports:/app/reports" backend-test:ci
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: reports/
          if-no-files-found: warn

  integration:
    needs: unit
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/feature/')
    permissions: { id-token: write, contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Run integration tests (docker compose)
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
        run: |
          set -euxo pipefail
          docker compose -f docker-compose.yaml up -d
          chmod +x scripts/integration_check.sh || true
          bash scripts/integration_check.sh
      - name: Teardown
        if: always()
        run: docker compose -f docker-compose.yaml down -v --remove-orphans || true

  e2e:
    needs: integration
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/feature/')
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Run e2e tests
        run: |
          set -euxo pipefail
          docker compose -f docker-compose.yaml up -d
          chmod +x scripts/e2e_check.sh || true
          bash scripts/e2e_check.sh
      - name: Teardown
        if: always()
        run: docker compose -f docker-compose.yaml down -v --remove-orphans || true

  version_bump:
    needs: e2e
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/heads/main')
    permissions: { contents: write }
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compute next version and tag
        id: bump
        shell: bash
        run: |
          set -euo pipefail
          latest=$(git tag --list "v*" --sort=-v:refname | head -n1 || true)
          if [[ -z "$latest" ]]; then
            major=1; minor=0; patch=0
          elif [[ "$latest" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            major=${BASH_REMATCH[1]}; minor=${BASH_REMATCH[2]}; patch=${BASH_REMATCH[3]}
            patch=$((patch+1))
          else
            major=1; minor=0; patch=0
          fi
          version="v${major}.${minor}.${patch}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          git config user.email "ci@github"
          git config user.name "github-actions"
          git tag -f "$version"
          git push --force origin "$version"
      - name: Update chart and values versions in external repo
        env:
          K8S_REPO_URL: ${{ secrets.K8S_REPO_URL }}
          K8S_REPO_TOKEN: ${{ secrets.K8S_REPO_TOKEN }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail
          tmpdir=$(mktemp -d)
          url_no_proto=${K8S_REPO_URL#https://}
          git clone "https://x-access-token:${K8S_REPO_TOKEN}@${url_no_proto}" "$tmpdir"
          cd "$tmpdir"
          clean="${VERSION#v}"
          sed -i "s/^appVersion:.*/appVersion: ${clean}/" k8s/charts/workout-stack/Chart.yaml
          sed -i "s#/backend:[^[:space:]]*#/backend:${VERSION}#g" k8s/charts/workout-stack/values.yaml
          sed -i "s#/frontend:[^[:space:]]*#/frontend:${VERSION}#g" k8s/charts/workout-stack/values.yaml
          git config user.email "ci@github"
          git config user.name "github-actions"
          git commit -am "chore: bump helm chart to ${VERSION}" || exit 0
          git push

  build_images:
    needs: version_bump
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/heads/main')
    permissions: { id-token: write, contents: read }
    env:
      REGISTRY: us-central1-docker.pkg.dev/porfolio-480111
      TAG: ${{ needs.version_bump.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
      - name: Docker auth to GAR
        run: gcloud auth configure-docker $GAR_LOCATION-docker.pkg.dev
      - uses: docker/setup-buildx-action@v3
      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.BACKEND_REPO }}/${{ env.BACKEND_IMAGE_NAME }}:${{ env.TAG }}
            ${{ env.REGISTRY }}/${{ env.BACKEND_REPO }}/${{ env.BACKEND_IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.FRONTEND_REPO }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ env.TAG }}
            ${{ env.REGISTRY }}/${{ env.FRONTEND_REPO }}/${{ env.FRONTEND_IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build_images
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/heads/main')
    permissions: { id-token: write, contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
      - name: Deploy placeholder
        run: |
          echo "Add deploy steps here (update manifests/values and trigger ArgoCD or kubectl apply)."
