name: deploy

on:
  workflow_dispatch:
  push:
    tags: ['v*']

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-22.04
    permissions: { id-token: write, contents: read }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Auth to GCP (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: porfolio-480111

      # Add your deploy logic here (e.g., bump Helm values/ArgoCD sync/terraform apply)
      - name: Deploy placeholder
        run: |
          echo "Add deploy steps here (update manifests/values and trigger ArgoCD or kubectl apply)."
