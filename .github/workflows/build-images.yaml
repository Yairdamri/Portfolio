name: build-images

on:
  workflow_dispatch:

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

env:
  GAR_LOCATION: us-central1
  PROJECT_ID: porfolio-480111
  BACKEND_REPO: workout-backend
  BACKEND_IMAGE_NAME: backend
  FRONTEND_REPO: workout-frontend
  FRONTEND_IMAGE_NAME: frontend

jobs:
  build-and-push:
    runs-on: ubuntu-22.04
    permissions: { id-token: write, contents: read }
    env:
      REGISTRY: us-central1-docker.pkg.dev/porfolio-480111
      TAG: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Auth to GCP (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Docker auth to GAR
        run: gcloud auth configure-docker $GAR_LOCATION-docker.pkg.dev

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.BACKEND_REPO }}/${{ env.BACKEND_IMAGE_NAME }}:${{ env.TAG }}
            ${{ env.REGISTRY }}/${{ env.BACKEND_REPO }}/${{ env.BACKEND_IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.FRONTEND_REPO }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ env.TAG }}
            ${{ env.REGISTRY }}/${{ env.FRONTEND_REPO }}/${{ env.FRONTEND_IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
