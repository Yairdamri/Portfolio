name: build-images

on:
  workflow_dispatch:

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

env:
  GAR_LOCATION: us-central1
  PROJECT_ID: porfolio-480111
  BACKEND_REPO: workout-backend-prod
  BACKEND_IMAGE_NAME: backend
  FRONTEND_REPO: workout-frontend-prod
  FRONTEND_IMAGE_NAME: frontend

jobs:
  version_bump:
    runs-on: ubuntu-22.04
    permissions: { contents: write }
    outputs:
      version: ${{ steps.tag.outputs.new_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: tag
        uses: anothrNick/github-tag-action@1.67.0
        env:
          GITHUB_TOKEN: ${{ secrets.K8S_REPO_TOKEN }}
          DEFAULT_BUMP: patch
          WITH_V: true
      - name: Update chart and values versions in external repo
        env:
          K8S_REPO_URL: ${{ secrets.K8S_REPO_URL }}
          K8S_REPO_TOKEN: ${{ secrets.K8S_REPO_TOKEN }}
          K8S_CHART_DIR: ${{ secrets.K8S_CHART_DIR }}
          VERSION: ${{ steps.tag.outputs.new_tag }}
        run: |
          set -euo pipefail
          tmpdir=$(mktemp -d)
          url_no_proto=${K8S_REPO_URL#https://}
          git clone "https://x-access-token:${K8S_REPO_TOKEN}@${url_no_proto}" "$tmpdir"
          cd "$tmpdir"
          chart_dir="${K8S_CHART_DIR:-charts/workout-stack}"
          if [ ! -f "${chart_dir}/Chart.yaml" ] || [ ! -f "${chart_dir}/values.yaml" ]; then
            echo "Expected Chart.yaml/values.yaml under ${chart_dir}, but they were not found. Set K8S_CHART_DIR secret to the correct path." >&2
            exit 1
          fi
          clean="${VERSION#v}"
          sed -i "s/^appVersion:.*/appVersion: ${clean}/" "${chart_dir}/Chart.yaml"
          # update image tags in values.yaml
          sed -i "s/^[[:space:]]*tag:.*/    tag: ${VERSION}/" "${chart_dir}/values.yaml"
          git config user.email "ci@github"
          git config user.name "github-actions"
          git commit -am "chore: bump helm chart to ${VERSION}" || exit 0
          git push

  build-and-push:
    needs: version_bump
    runs-on: ubuntu-22.04
    permissions: { id-token: write, contents: read }
    env:
      REGISTRY: us-central1-docker.pkg.dev/porfolio-480111
      TAG: ${{ needs.version_bump.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Auth to GCP (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Docker auth to GAR
        run: gcloud auth configure-docker $GAR_LOCATION-docker.pkg.dev

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.BACKEND_REPO }}/${{ env.BACKEND_IMAGE_NAME }}:${{ env.TAG }}
            ${{ env.REGISTRY }}/${{ env.BACKEND_REPO }}/${{ env.BACKEND_IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.FRONTEND_REPO }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ env.TAG }}
            ${{ env.REGISTRY }}/${{ env.FRONTEND_REPO }}/${{ env.FRONTEND_IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Slack notify
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          STATUS: ${{ job.status }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "No SLACK_WEBHOOK_URL set, skipping"; exit 0; fi
          msg="build-images job *${STATUS}* on ${GITHUB_REF} (run ${GITHUB_RUN_NUMBER})."
          curl -X POST -H 'Content-type: application/json' --data "{\"text\":\"$msg\"}" "$SLACK_WEBHOOK_URL"
