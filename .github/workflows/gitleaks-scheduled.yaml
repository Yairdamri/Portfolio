name: Gitleaks (Scheduled)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks (full history)
        uses: gitleaks/gitleaks-action@v2
        with:
          args: detect --redact --verbose
