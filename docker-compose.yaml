version: '3.8'

services:
  web:
    build: .
    # No published ports; Nginx will proxy internally
    volumes:
      - .:/app
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    env_file:
      - .env
    depends_on:
      - db
    restart: unless-stopped

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - web
      - frontend
    restart: unless-stopped

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run build && sleep infinity"
    restart: unless-stopped

  db:
    image: mongo:latest
    # Do not publish ports; only internal access from web
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  mongo_data:
